name: Booking validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inspect checkout SQL
        run: |
          grep -R -n "create or replace function public.submit_cart_order_v2" supabase/migrations || true
          grep -R -n "create or replace function public.submit_cart_order_v[0-9]" supabase/migrations || true

      - name: Package relevant source
        run: tar -czf checkout-source.tgz supabase/migrations lib/cart components/clone scripts package.json package-lock.json tsconfig.json

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: glina-followup-source
          path: checkout-source.tgz
          retention-days: 1
