name: Booking validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v5
        with:
          ref: hotfix/followup-picker-production
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply follow-up picker repair
        run: |
          python - <<'PY'
          from pathlib import Path

          checkout = Path('components/clone/checkout-page-client.tsx')
          text = checkout.read_text()

          old_lines = '        lines: validated.lines,'
          if text.count(old_lines) != 1:
              raise SystemExit(f'Expected one checkout submission anchor, found {text.count(old_lines)}')
          text = text.replace(old_lines, '        lines: expandedLines,')

          old_required = '''                  <select
                    required
                    className="mt-1 w-full border px-3 py-2"
                    value={followupByPrimary[line.sessionId] ?? ''}'''
          new_required = '''                  <select
                    required={line.requiresFollowupSession}
                    className="mt-1 w-full border px-3 py-2"
                    value={followupByPrimary[line.sessionId] ?? ''}'''
          if text.count(old_required) != 1:
              raise SystemExit(f'Expected one follow-up select anchor, found {text.count(old_required)}')
          checkout.write_text(text.replace(old_required, new_required))

          contract = Path('lib/cart/__tests__/linked-workshop-ux-contract.test.ts')
          test = contract.read_text()
          anchor = '''    expect(checkoutUi).toContain("linkRole: 'followup'");
'''
          addition = '''    expect(checkoutUi).toContain("linkRole: 'followup'");
    expect(checkoutUi).toContain('lines: expandedLines');
    expect(checkoutUi).toContain(
      'required={line.requiresFollowupSession}'
    );
'''
          if test.count(anchor) != 1:
              raise SystemExit(f'Expected one contract anchor, found {test.count(anchor)}')
          contract.write_text(test.replace(anchor, addition))

          migration = Path('supabase/migrations/00000000000031_glina_do_wina_optional_followup_repair.sql')
          migration.write_text(r'''-- Ceramika Nero — repair production Glina do Wina optional glazing configuration.
-- Apply after migration 30.

-- Migration 26 configured Glina do Wina only when a glazing workshop already
-- existed at that exact migration moment. Production workshops can be created
-- later through the admin portal, so resolve the relationship from current data.
do $$
declare
  v_primary uuid;
  v_existing_followup uuid;
  v_followup uuid;
  v_followup_type text;
begin
  select id, followup_workshop_id
    into v_primary, v_existing_followup
  from public.workshops
  where slug in ('glina-do-wina', 'glinadowina')
     or lower(trim(title)) = 'glina do wina'
  order by created_at asc
  limit 1;

  if v_primary is null then
    raise notice 'Glina do Wina workshop not found; optional follow-up repair skipped';
    return;
  end if;

  select w.id,
         coalesce(nullif(trim(w.workshop_type), ''), w.slug, 'szkliwienie')
    into v_followup, v_followup_type
  from public.workshops w
  where w.id <> v_primary
    and w.status = 'published'
    and w.archived_at is null
    and w.booking_mode = 'scheduled'
    and (
      w.id = v_existing_followup
      or lower(w.slug) like '%szkliw%'
      or lower(w.title) like '%szkliw%'
      or lower(coalesce(w.workshop_type, '')) like '%szkliw%'
    )
  order by
    case when w.id = v_existing_followup then 0 else 1 end,
    case when exists (
      select 1
      from public.workshop_sessions s
      where s.workshop_id = w.id
        and s.starts_at > timezone('utc'::text, now())
        and s.status in ('scheduled', 'sold_out')
    ) then 0 else 1 end,
    w.created_at asc
  limit 1;

  update public.workshops
  set offers_followup_session = true,
      requires_followup_session = false,
      followup_workshop_id = coalesce(v_followup, followup_workshop_id),
      followup_workshop_type = coalesce(
        v_followup_type,
        nullif(trim(followup_workshop_type), ''),
        'szkliwienie'
      ),
      followup_min_days = coalesce(followup_min_days, 5),
      followup_max_days = coalesce(followup_max_days, 45),
      updated_at = timezone('utc'::text, now())
  where id = v_primary;

  if v_followup is null then
    raise notice 'Glina do Wina now offers optional glazing, but no published glazing workshop was auto-detected';
  end if;
end
$$;
''')

          canonical = '''name: Booking validation

