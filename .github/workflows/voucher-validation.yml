name: Voucher validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Migration harness
        run: npm run test:migrations

      - name: Voucher lifecycle integration
        run: |
          node -e "const fs=require('fs'); const p='scripts/test-voucher-lifecycle-pglite.mjs'; let s=fs.readFileSync(p,'utf8'); const a=\"assert(state.voucher_payment_status === 'paid', 'Voucher ledger not committed');\"; const b=\"if (state.voucher_payment_status !== 'paid') { const debugPayments = await db.query('select id, order_id, booking_id, provider, status, amount_gross_grosz, provider_payment_id, idempotency_key from public.payments order by created_at'); console.error('PARTIAL STATE', JSON.stringify(state)); console.error('PAYMENTS', JSON.stringify(debugPayments.rows)); }\\n  assert(state.voucher_payment_status === 'paid', 'Voucher ledger not committed');\"; if(!s.includes(a)) throw new Error('diagnostic assertion not found'); fs.writeFileSync(p,s.replace(a,b));"
          npm run test:vouchers:pglite

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SECRET_KEY: test-secret-key
          PAYMENTS_PROVIDER: manual
        run: npm run build
