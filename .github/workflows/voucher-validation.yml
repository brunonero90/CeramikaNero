name: Booking validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inspect checkout SQL
        run: |
          grep -R -n "create or replace function public.submit_cart_order_v2" supabase/migrations || true
          grep -R -n "create or replace function public.submit_cart_order_v[0-9]" supabase/migrations || true

      - name: Package workspace
        run: tar --exclude=.git -czf workspace.tgz .

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: glina-followup-workspace
          path: workspace.tgz
          retention-days: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Migration harness
        run: npm run test:migrations

      - name: Voucher lifecycle integration
        run: npm run test:vouchers:pglite

      - name: Linked workshop lifecycle integration
        run: npm run test:linked-workshops:pglite

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SECRET_KEY: test-secret-key
          PAYMENTS_PROVIDER: manual
        run: npm run build
