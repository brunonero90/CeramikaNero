name: Booking validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v5
        with:
          ref: hotfix/followup-picker-production
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply follow-up picker repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          checkout = Path('components/clone/checkout-page-client.tsx')
          text = checkout.read_text()
          old_lines = '        lines: validated.lines,'
          if text.count(old_lines) != 1:
              raise SystemExit(f'Expected one checkout submission anchor, found {text.count(old_lines)}')
          text = text.replace(old_lines, '        lines: expandedLines,')

          old_required = '                  <select\n                    required\n                    className="mt-1 w-full border px-3 py-2"\n                    value={followupByPrimary[line.sessionId] ?? \'\'}'
          new_required = '                  <select\n                    required={line.requiresFollowupSession}\n                    className="mt-1 w-full border px-3 py-2"\n                    value={followupByPrimary[line.sessionId] ?? \'\'}'
          if text.count(old_required) != 1:
              raise SystemExit(f'Expected one follow-up select anchor, found {text.count(old_required)}')
          checkout.write_text(text.replace(old_required, new_required))

          contract = Path('lib/cart/__tests__/linked-workshop-ux-contract.test.ts')
          test = contract.read_text()
          anchor = '    expect(checkoutUi).toContain("linkRole: \'followup\'");\n'
          addition = anchor + "    expect(checkoutUi).toContain('lines: expandedLines');\n    expect(checkoutUi).toContain(\n      'required={line.requiresFollowupSession}'\n    );\n"
          if test.count(anchor) != 1:
              raise SystemExit(f'Expected one contract anchor, found {test.count(anchor)}')
          contract.write_text(test.replace(anchor, addition))

          migration_b64 = ''
          canonical_b64 = ''
          Path('supabase/migrations/00000000000031_glina_do_wina_optional_followup_repair.sql').write_bytes(base64.b64decode(migration_b64))
          Path('.github/workflows/voucher-validation.yml').write_bytes(base64.b64decode(canonical_b64))
          Path('.github/workflows/apply-followup-picker-hotfix.yml').unlink(missing_ok=True)
          Path('tmp/followup-picker-trigger.txt').unlink(missing_ok=True)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format hotfix
        run: |
          npx prettier --write \
            components/clone/checkout-page-client.tsx \
            lib/cart/__tests__/linked-workshop-ux-contract.test.ts

      - name: Validate hotfix
        run: |
          npm audit --omit=dev --audit-level=high
          npm run typecheck -- --pretty false
          npm run test:migrations
          npm run test:linked-workshops:pglite
          npx vitest run lib/cart/__tests__/linked-workshop-ux-contract.test.ts

      - name: Publish hotfix
        run: |
          git diff --check
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix optional glazing picker in production"
          git push origin HEAD:hotfix/followup-picker-production
