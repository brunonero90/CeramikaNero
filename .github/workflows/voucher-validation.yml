name: Booking validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply optional follow-up hotfix
        run: node scripts/apply-optional-followup-hotfix.mjs

      - name: Install dependencies
        run: npm ci

      - name: Format hotfix
        run: |
          npx prettier --write \
            components/clone/checkout-page-client.tsx \
            lib/cart/revalidate.ts \
            lib/cart/checkout.ts \
            lib/admin/schemas.ts \
            'app/admin/(protected)/warsztaty/actions.ts' \
            'app/admin/(protected)/warsztaty/workshop-form.tsx' \
            'app/admin/(protected)/warsztaty/[id]/page.tsx' \
            lib/cart/__tests__/linked-workshop-ux-contract.test.ts \
            scripts/test-linked-workshops-pglite.mjs \
            docs/LINKED_WORKSHOPS_AND_REMINDERS.md

      - name: Publish hotfix
        run: |
          git diff --check
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Glina do Wina follow-up optional"
          git push origin HEAD:${{ github.head_ref }}

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Migration harness
        run: npm run test:migrations

      - name: Voucher lifecycle integration
        run: npm run test:vouchers:pglite

      - name: Linked workshop lifecycle integration
        run: npm run test:linked-workshops:pglite

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SECRET_KEY: test-secret-key
          PAYMENTS_PROVIDER: manual
        run: npm run build
