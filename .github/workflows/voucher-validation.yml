name: Voucher validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply linked workshop sprint
        if: ${{ hashFiles('scripts/apply-linked-workshops-sprint.mjs') != '' }}
        run: node scripts/apply-linked-workshops-sprint.mjs

      - name: Install dependencies
        run: npm ci

      - name: Format implementation
        if: ${{ hashFiles('scripts/apply-linked-workshops-sprint.mjs') != '' }}
        run: |
          npx prettier --write \
            components/clone/checkout-page-client.tsx \
            lib/cart/checkout.ts \
            lib/booking/email-dispatch.ts \
            lib/booking/email-templates.ts \
            lib/database/schema.ts \
            lib/email/types.ts \
            lib/email/catalog.ts \
            lib/email/templates/bookings.tsx \
            lib/admin/schemas.ts \
            'app/admin/(protected)/warsztaty/actions.ts' \
            'app/admin/(protected)/warsztaty/workshop-form.tsx' \
            'app/admin/(protected)/warsztaty/[id]/page.tsx' \
            'app/admin/(protected)/rezerwacje/actions.ts' \
            'app/admin/(protected)/rezerwacje/[id]/page.tsx' \
            package.json \
            scripts/test-linked-workshops-pglite.mjs \
            supabase/migrations/00000000000026_linked_workshops_and_reminders.sql

      - name: Publish implementation commit
        if: ${{ hashFiles('scripts/apply-linked-workshops-sprint.mjs') != '' }}
        run: |
          git diff --check
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Implement linked workshop booking and reminders"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Migration harness
        run: npm run test:migrations

      - name: Voucher lifecycle integration
        run: npm run test:vouchers:pglite

      - name: Linked workshop lifecycle integration
        run: npm run test:linked-workshops:pglite

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SECRET_KEY: test-secret-key
          PAYMENTS_PROVIDER: manual
        run: npm run build
