[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  # Never enable local booking fixtures in Netlify production builds.
  BOOKING_LOCAL_MODE = ""
  FIDELITY_FIXTURES = ""

[functions]
  directory = "netlify/functions"

[functions."booking-expiry"]
  schedule = "*/10 * * * *"

[functions."booking-email-dispatch"]
  schedule = "*/5 * * * *"
